apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-redis-0
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data/redis-0"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-redis-1
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data/redis-1"