- name: Installing basic packages
  apt:
    name:
      - vim
      - git
      - mc
      - ufw
    state: present

- name: Configuring SSH-keys
  copy:
    src: authorized_keys
    dest: /home/vladv/devops/devops-r-d/lecture-32/roles/baseline/files/authorized_keys
    owner: "{{ ansible_user }}"
    mode: '0600'

- name: Check Secret
  debug:
    msg: "SQL pass {{ vault_mysql_password }}"
