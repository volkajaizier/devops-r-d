# Source: vernemq/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vernemq
  namespace: prod
  labels:
    app.kubernetes.io/name: vernemq
    app.kubernetes.io/instance: vernemq
---
# Source: vernemq/templates/role.yaml
# VerneMQ needs to query k8s apiserver to list the other pods in the namespace
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: vernemq
  namespace: prod
  labels:
    app.kubernetes.io/name: vernemq
    app.kubernetes.io/instance: vernemq
rules:
  - apiGroups: [""] # "" indicates the core API group
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
---
# Source: vernemq/templates/rolebinding.yaml
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: vernemq
  namespace: prod
  labels:
    app.kubernetes.io/name: vernemq
    app.kubernetes.io/instance: vernemq
subjects:
  - kind: ServiceAccount
    name: vernemq
    namespace: prod
roleRef:
  kind: Role
  name: vernemq
  apiGroup: rbac.authorization.k8s.io