apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: pointgrab
  namespace: prod
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      # Example consumer Acls for topic my-topic using consumer group my-group
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operation: Read
        host: "*"
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operation: Describe
        host: "*"
      - resource:
          type: group
          name: "*"
          patternType: literal
        operation: Read
        host: "*"
      # Example Producer Acls for topic my-topic
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operation: Write
        host: "*"
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operation: Create
        host: "*"
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operation: Describe
        host: "*"