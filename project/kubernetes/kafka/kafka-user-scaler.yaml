apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: scaler
  namespace: prod
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operation: Write
        host: "*"
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operation: Create
        host: "*"
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operation: Describe
        host: "*"
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operation: Delete
        host: "*"
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operation: DescribeConfigs
        host: "*"
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operation: Alter
        host: "*"
      - resource:
          type: cluster
          name: "*"
          patternType: literal
        operation: Alter
        host: "*"
      - resource:
          type: group
          name: "*"
          patternType: literal
        operation: Describe
        host: "*"